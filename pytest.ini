[pytest]
testpaths = tests
addopts = --basetemp=tests/.pytest_tmp -p no:cacheprovider
norecursedirs = .git .venv .tmp outputs outputs_* tests/pytest-cache-files-* tests/.pytest_tmp tests/.tmp*

filterwarnings =
    # seaborn 0.13 이 내부적으로 matplotlib 의 ax.bxp(vert=...) 를 호출해서 나는 경고다.
    # 우리 코드로는 제어할 수 없으므로, seaborn 이 고쳐지면 이 줄을 지우면 된다.
    # (filterwarnings 는 ":" 로 필드를 나누므로 메시지 패턴에 콜론을 쓸 수 없다)
    ignore:vert:PendingDeprecationWarning
